plugins {
    id 'java'
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group = 'AuroraParties'
version = '1.4.4'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        url = 'https://repo.aikar.co/content/groups/aikar/'
    }
    flatDir {
        dirs '.'
    }
}

dependencies {
    implementation 'org.bstats:bstats-bukkit:3.0.0'
    implementation "co.aikar:acf-paper:0.5.1-SNAPSHOT"

    compileOnly "io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT"
    compileOnly ':AuroraDuels:1.12.17'
    compileOnly ':AuroraKits:1.7.6'
    compileOnly ':AuroraWarps:1.1.0'
    compileOnly ':AuroraCombat:1.7.0'
}

build {
    dependsOn(shadowJar)
}

shadowJar {
    minimize()
    archiveFileName.set("${project.name}-${project.version}.jar")
    relocate 'org.bstats', 'club.aurorapvp.auroraparties.shaded.bstats'
    relocate 'co.aikar.commands', 'club.aurorapvp.auroraparties.shaded.acf'
    relocate 'co.aikar.locales', 'club.aurorapvp.auroraparties.shaded.locales'
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}
